name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # Two environments, because the transport behaves differently on each and both are real
    # deployment targets:
    #   - Ubuntu 24.04 has OpenSSL 3.0, which cannot do ML-KEM. The tls suite must show the hybrid
    #     group being dropped with a warning and the handshake falling back to a classical group.
    #     This is also what the release artifacts are currently built on.
    #   - Debian 13 has OpenSSL 3.5, so the same suite must show X25519MLKEM768 actually
    #     negotiated. Without this leg, nothing in CI ever exercises the post-quantum path.
    # The tls suite asserts whichever of the two applies, so one suite gates both behaviours.
    # Debian 13 also matches the dev container, so toolchain drift shows up here rather than on
    # someone's next container rebuild.
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-24.04
            name: ubuntu-24.04 (OpenSSL 3.0, classical fallback)
            container: ''
          - id: debian-13
            name: debian-13 (OpenSSL 3.5, hybrid post-quantum)
            container: 'debian:13'
    steps:
      # The plain container image has no git, and actions/checkout silently degrades to a REST
      # tarball download without it. Installing it first keeps both legs checking out the same way.
      - name: Install git (container leg only)
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        # The runner leg needs sudo; inside the container this already runs as root.
        run: |
          SUDO=""
          command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO apt-get update
          # libssl-dev is what enables the TLS transport (rung 3.5). Without it the build still
          # succeeds - rung 0 only - and the tls suite would have nothing to test, so it is
          # installed rather than left to chance. The openssl CLI is used by lab/gen-certs.sh.
          $SUDO apt-get install -y --no-install-recommends \
            build-essential cmake python3 libssl-dev openssl ca-certificates curl

      - name: Report the OpenSSL in use
        # Recorded per leg so a change in the base image's OpenSSL - which decides whether the
        # hybrid group is available at all - is visible in the log rather than inferred.
        run: openssl version

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          # Keyed per leg: the two use different compilers, so their build artifacts are not
          # interchangeable. Uses matrix.id, not matrix.name - cache keys can't contain commas,
          # and the display name does.
          key: deps-${{ matrix.id }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            deps-${{ matrix.id }}-

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Dependency link smoke test
        run: ctest --test-dir build --output-on-failure

      - name: Integration test suites (gating)
        # These suites are expected to pass outright; a failure here fails the job.
        # conc/multi/resume are deliberately run separately below, non-blocking - see that
        # step for why.
        run: |
          for suite in basic core folder auth sync batch tiers sec tls vault err robust ipc log; do
            echo "::group::suite: $suite"
            python3 tests/integration/run_all_tests.py --suite "$suite"
            echo "::endgroup::"
          done

      - name: Upload test logs (on failure)
        # The step log only shows pass/fail per check. The client and server transcripts under
        # test_logs/ are what actually say why a check failed (e.g. a 503 hidden behind a
        # has_ok_response() false positive), and they vanish with the runner otherwise.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.id }}
          path: test_logs/
          retention-days: 7

      - name: Integration test suites (known pre-existing gaps, non-blocking)
        # conc/multi: two individual checks in these suites have a test-harness false
        # positive (the assertion matches "ok" anywhere in the client's login-banner output
        # rather than the specific response it means to check), not a server/client bug.
        # resume: driven in public mode by this suite, but resuming is a private-mode-only
        # feature, so there is nothing to resume - a test-harness gap, not a product bug.
        # Kept here (rather than deleted) so a regression in the *other*, currently-passing
        # checks in these suites is still visible.
        continue-on-error: true
        run: |
          for suite in conc multi resume; do
            echo "::group::suite: $suite (non-blocking)"
            timeout 320 python3 tests/integration/run_all_tests.py --suite "$suite" || true
            echo "::endgroup::"
          done

  headless-client:
    # Turns "the client is portable in principle" into a verified claim.
    #
    # The only unportable part of the client is the interactive terminal UI (termios,
    # asio::posix::stream_descriptor, dup(stdin)), and a headless build does not compile it -
    # there is no platform abstraction to maintain, the file is simply left out. What remains is
    # the whole client: same state machine, same wire protocol, same SYNC/batch/resume engines,
    # same vault crypto, driven over --ipc instead of a terminal. That is exactly what the desktop
    # GUI drives as a sidecar, so this job is what makes a Windows/macOS GUI possible.
    #
    # The server stays Linux-only by design and is only built on the Linux leg.
    name: headless client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSSL (macOS)
        # Homebrew's openssl@3 is keg-only, so CMake needs to be pointed at it explicitly or the
        # build silently falls back to rung 0 and this job stops covering the TLS code at all.
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build-headless/_deps
          key: headless-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            headless-${{ matrix.os }}-

      - name: Configure
        run: cmake -S . -B build-headless -DCMAKE_BUILD_TYPE=Release -DMINIDRIVE_INTERACTIVE_CLI=OFF -DMINIDRIVE_BUILD_TESTS=OFF

      - name: Build the headless client
        run: cmake --build build-headless --target minidrive_client --config Release -j 2

      - name: Smoke test the binary
        # Needs no server and no socket: it proves the binary links, starts, and refuses the mode
        # it was not built for. Without this the job would only prove that the code compiles.
        shell: bash
        run: |
          CLIENT=build-headless/client/client
          [ -x "$CLIENT" ] || CLIENT=build-headless/client/Release/client.exe
          echo "Using $CLIENT"

          # No arguments: usage, and a non-zero exit.
          set +e
          "$CLIENT" > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          [ "$rc" -ne 0 ] || { echo "expected a non-zero exit with no arguments"; exit 1; }
          grep -q -- "--ipc" out.txt || { echo "usage does not mention --ipc"; exit 1; }

          # An endpoint but no --ipc: a headless build has no terminal mode to fall back to.
          set +e
          "$CLIENT" 127.0.0.1:9999 < /dev/null > out2.txt 2>&1
          rc=$?
          set -e
          cat out2.txt
          [ "$rc" -eq 1 ] || { echo "expected rc=1 without --ipc, got $rc"; exit 1; }
          grep -qi "headless" out2.txt || { echo "no explanation of headless mode"; exit 1; }

      - name: Build the server and run the ipc suite (POSIX only)
        # The suite's host side speaks AF_UNIX, which is what the client uses on POSIX. On Windows
        # the client connects to a named pipe instead, and the process driving that pipe is the
        # GUI's Rust core - so Windows gets build + smoke coverage here, and the pipe path is
        # exercised by the GUI's own tests when that lands.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build build-headless --target minidrive_server -j 2
          MINIDRIVE_BUILD_DIR="$PWD/build-headless" python3 tests/integration/run_all_tests.py --suite ipc

      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headless-logs-${{ matrix.os }}
          path: test_logs/
          retention-days: 7
